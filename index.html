<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <title>AssetMX - Enterprise Asset Management</title>
    <script>
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          var pre = document.createElement('pre');
          pre.style.whiteSpace = 'pre-wrap';
          pre.style.font = '13px/1.5 monospace';
          pre.style.padding = '16px';
          pre.style.color = '#b00020';
          pre.style.background = '#fff';
          pre.textContent = 'ASSETMX RUNTIME ERROR:\n\n' + msg;
          if (root) { root.innerHTML = ''; root.appendChild(pre); }
          else { document.body.appendChild(pre); }
        }
        window.addEventListener('error', function (e) {
          show((e.error && e.error.stack) ? e.error.stack : e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Unhandled rejection:\n' + ((r && r.stack) ? r.stack : String(r)));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
