services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: assetmx
      MYSQL_USER: assetmx
      MYSQL_PASSWORD: assetmx
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "assetmx", "-passetmx"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - assetmx_mysql:/var/lib/mysql

volumes:
  assetmx_mysql:
